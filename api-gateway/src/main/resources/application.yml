spring:
  cloud:
    gateway:
      routes:
        - id: patient-service-route
          uri: http://patient-service:4000  #internal uri of patient-service container (docker will resolve the patient-service and port is docker port)
          predicates:
            - Path=/api/patient/**
        - id: patient-service-docs-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients, /api-docs/patients/v3/api-docs

## REST CLIENT -> http://localhost:4000/api/patients
## API GATEWAY ->  changes the request to -> http://patient-service:4000/patients
## PATIENT SERVICE (SPRING BOOT APP) -? /patients -> Patients Array
server:
  port: 4004
